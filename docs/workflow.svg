<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" font-family="Inter, 'Segoe UI', system-ui, sans-serif" role="img" aria-label="CodeSage review workflow and use-cases">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d15"/>
      <stop offset="1" stop-color="#0f1320"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="1280" height="780" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="779" rx="20" fill="none" stroke="#262b3e"/>

  <!-- Header -->
  <g transform="translate(40,40)">
    <rect width="34" height="34" rx="9" fill="url(#accent)"/>
    <path d="M12,9 L6,17 L12,25 M22,9 L28,17 L22,25" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="17" fill="#e2e8f0" font-size="22" font-weight="700">CodeSage</text>
    <text x="48" y="38" fill="#94a3b8" font-size="13.5">Agentic code-review workflow &amp; use-cases</text>
  </g>
  <g transform="translate(1010,46)">
    <rect width="230" height="26" rx="13" fill="#10141f" stroke="#262b3e"/>
    <circle cx="18" cy="13" r="4" fill="#34d399"/>
    <text x="30" y="17.5" fill="#94a3b8" font-size="12">LangGraph · Claude · pgvector RAG</text>
  </g>

  <!-- Section label: pipeline -->
  <text x="40" y="118" fill="#64748b" font-size="12" font-weight="600" letter-spacing="1.5">THE PIPELINE — ONE REVIEW</text>

  <!-- Pipeline nodes -->
  <!-- helper geometry: x = 40 + i*173, w=153, y=132, h=104 -->
  <g font-size="14.5" font-weight="600">
    <!-- 0 Submit -->
    <g transform="translate(40,132)" filter="url(#shadow)">
      <rect width="153" height="104" rx="13" fill="#141826" stroke="#2b3147"/>
      <rect width="153" height="4" rx="2" fill="#818cf8"/>
      <text x="16" y="34" fill="#818cf8" font-size="11" font-weight="700" letter-spacing="0.5">1 · SUBMIT</text>
      <text x="16" y="60" fill="#e2e8f0">Diff or PR</text>
      <text x="16" y="82" fill="#94a3b8" font-size="11.5" font-weight="400">Web · REST · MCP</text>
    </g>
    <!-- 1 RAG -->
    <g transform="translate(213,132)" filter="url(#shadow)">
      <rect width="153" height="104" rx="13" fill="#141826" stroke="#2b3147"/>
      <rect width="153" height="4" rx="2" fill="#38bdf8"/>
      <text x="16" y="34" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.5">2 · RETRIEVE</text>
      <text x="16" y="60" fill="#e2e8f0">pgvector RAG</text>
      <text x="16" y="82" fill="#94a3b8" font-size="11.5" font-weight="400">Cite real code</text>
    </g>
    <!-- 2 Reviewers (parallel) -->
    <g transform="translate(386,132)" filter="url(#shadow)">
      <rect width="153" height="104" rx="13" fill="#141826" stroke="#2b3147"/>
      <rect width="153" height="4" rx="2" fill="url(#accent)"/>
      <text x="16" y="34" fill="#a5b4fc" font-size="11" font-weight="700" letter-spacing="0.5">3 · REVIEW ×3</text>
      <g font-size="11.5" font-weight="500">
        <circle cx="20" cy="56" r="3.5" fill="#fb7185"/><text x="31" y="60" fill="#cbd5e1">Security</text>
        <circle cx="20" cy="74" r="3.5" fill="#38bdf8"/><text x="31" y="78" fill="#cbd5e1">Correctness</text>
        <circle cx="20" cy="92" r="3.5" fill="#a78bfa"/><text x="31" y="96" fill="#cbd5e1">Style</text>
      </g>
      <text x="150" y="20" fill="#64748b" font-size="10" font-weight="500" text-anchor="end">parallel · ReAct</text>
    </g>
    <!-- 3 Reflection -->
    <g transform="translate(559,132)" filter="url(#shadow)">
      <rect width="153" height="104" rx="13" fill="#141826" stroke="#2b3147"/>
      <rect width="153" height="4" rx="2" fill="#34d399"/>
      <text x="16" y="34" fill="#34d399" font-size="11" font-weight="700" letter-spacing="0.5">4 · REFLECT</text>
      <text x="16" y="60" fill="#e2e8f0">Consolidate</text>
      <text x="16" y="82" fill="#94a3b8" font-size="11.5" font-weight="400">De-dupe · self-critique</text>
    </g>
    <!-- 4 Judge -->
    <g transform="translate(732,132)" filter="url(#shadow)">
      <rect width="153" height="104" rx="13" fill="#141826" stroke="#2b3147"/>
      <rect width="153" height="4" rx="2" fill="#fbbf24"/>
      <text x="16" y="34" fill="#fbbf24" font-size="11" font-weight="700" letter-spacing="0.5">5 · JUDGE</text>
      <text x="16" y="60" fill="#e2e8f0">LLM-as-Judge</text>
      <text x="16" y="82" fill="#94a3b8" font-size="11.5" font-weight="400">4-dim quality score</text>
    </g>
    <!-- 5 Gate -->
    <g transform="translate(905,132)" filter="url(#shadow)">
      <rect width="153" height="104" rx="13" fill="#141826" stroke="#2b3147"/>
      <rect width="153" height="4" rx="2" fill="#fb923c"/>
      <text x="16" y="34" fill="#fb923c" font-size="11" font-weight="700" letter-spacing="0.5">6 · HUMAN GATE</text>
      <text x="16" y="60" fill="#e2e8f0">HITL decision</text>
      <text x="16" y="82" fill="#94a3b8" font-size="11.5" font-weight="400">Approve · reject</text>
    </g>
    <!-- 6 Report -->
    <g transform="translate(1078,132)" filter="url(#shadow)">
      <rect width="153" height="104" rx="13" fill="#141826" stroke="#2b3147"/>
      <rect width="153" height="4" rx="2" fill="#22d3ee"/>
      <text x="16" y="34" fill="#22d3ee" font-size="11" font-weight="700" letter-spacing="0.5">7 · REPORT</text>
      <text x="16" y="60" fill="#e2e8f0">Findings</text>
      <text x="16" y="82" fill="#94a3b8" font-size="11.5" font-weight="400">+ traces &amp; cost</text>
    </g>
  </g>

  <!-- Arrows between nodes -->
  <g stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)" opacity="0.9">
    <line x1="194" y1="184" x2="210" y2="184"/>
    <line x1="367" y1="184" x2="383" y2="184"/>
    <line x1="540" y1="184" x2="556" y2="184"/>
    <line x1="713" y1="184" x2="729" y2="184"/>
    <line x1="886" y1="184" x2="902" y2="184"/>
    <line x1="1059" y1="184" x2="1075" y2="184"/>
  </g>

  <!-- Real-time SSE ribbon -->
  <g transform="translate(40,266)">
    <rect width="1191" height="46" rx="12" fill="url(#ribbon)" stroke="#3730a3" stroke-opacity="0.5"/>
    <g transform="translate(18,23)">
      <path d="M6,-8 L-2,2 L3,2 L-1,10 L9,-1 L3,-1 Z" fill="#fbbf24"/>
    </g>
    <text x="44" y="22" fill="#c7d2fe" font-size="13.5" font-weight="600">Real-time progress streamed over Server-Sent Events</text>
    <text x="44" y="38" fill="#8b93c4" font-size="11.5">review.started → stage.completed ×6 → telemetry.update → review.completed</text>
    <g font-size="11" font-weight="600" text-anchor="middle">
      <g transform="translate(900,23)"><rect x="-46" y="-12" width="92" height="24" rx="12" fill="#10141f" stroke="#3730a3"/><text y="4" fill="#a5b4fc">live timeline</text></g>
      <g transform="translate(1010,23)"><rect x="-44" y="-12" width="88" height="24" rx="12" fill="#10141f" stroke="#3730a3"/><text y="4" fill="#a5b4fc">activity log</text></g>
      <g transform="translate(1130,23)"><rect x="-52" y="-12" width="104" height="24" rx="12" fill="#10141f" stroke="#3730a3"/><text y="4" fill="#a5b4fc">live cost meter</text></g>
    </g>
  </g>

  <!-- Section label: use-cases -->
  <text x="40" y="372" fill="#64748b" font-size="12" font-weight="600" letter-spacing="1.5">WHAT YOU CAN DO — WEB CONSOLE USE-CASES</text>

  <!-- Use-case cards: 3 cols x 2 rows. card w=378 h=128, gap x=20 y=20, start x=40 y=392 -->
  <g>
    <!-- Live Review Console -->
    <g transform="translate(40,392)" filter="url(#shadow)">
      <rect width="378" height="128" rx="14" fill="#121722" stroke="#2b3147"/>
      <rect width="5" height="128" rx="2.5" fill="#818cf8"/>
      <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">Live Review Console</text>
      <text x="24" y="62" fill="#94a3b8" font-size="13">Submit a diff and watch the agents reason in real</text>
      <text x="24" y="80" fill="#94a3b8" font-size="13">time — stage timeline, ReAct traces, judge score.</text>
      <g font-size="10.5" font-weight="600" fill="#a5b4fc">
        <g transform="translate(24,98)"><rect width="86" height="20" rx="10" fill="#1b2030" stroke="#2b3147"/><text x="43" y="14" text-anchor="middle">streaming</text></g>
        <g transform="translate(118,98)"><rect width="74" height="20" rx="10" fill="#1b2030" stroke="#2b3147"/><text x="37" y="14" text-anchor="middle">traces</text></g>
      </g>
    </g>
    <!-- Approval Queue -->
    <g transform="translate(438,392)" filter="url(#shadow)">
      <rect width="378" height="128" rx="14" fill="#121722" stroke="#2b3147"/>
      <rect width="5" height="128" rx="2.5" fill="#fb923c"/>
      <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">Approval Queue</text>
      <text x="24" y="62" fill="#94a3b8" font-size="13">Human-in-the-loop gate: review and approve or</text>
      <text x="24" y="80" fill="#94a3b8" font-size="13">reject the runs that breach the judge threshold.</text>
      <g font-size="10.5" font-weight="600" fill="#fdba74">
        <g transform="translate(24,98)"><rect width="58" height="20" rx="10" fill="#1f1a14" stroke="#43321c"/><text x="29" y="14" text-anchor="middle">HITL</text></g>
        <g transform="translate(90,98)"><rect width="92" height="20" rx="10" fill="#1f1a14" stroke="#43321c"/><text x="46" y="14" text-anchor="middle">sign-off gate</text></g>
      </g>
    </g>
    <!-- Cost & Telemetry -->
    <g transform="translate(836,392)" filter="url(#shadow)">
      <rect width="378" height="128" rx="14" fill="#121722" stroke="#2b3147"/>
      <rect width="5" height="128" rx="2.5" fill="#34d399"/>
      <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">Cost &amp; Telemetry</text>
      <text x="24" y="62" fill="#94a3b8" font-size="13">Token usage and USD cost metered per pipeline</text>
      <text x="24" y="80" fill="#94a3b8" font-size="13">component, aggregated across every review.</text>
      <g font-size="10.5" font-weight="600" fill="#6ee7b7">
        <g transform="translate(24,98)"><rect width="74" height="20" rx="10" fill="#10201a" stroke="#1c3a2e"/><text x="37" y="14" text-anchor="middle">$ / review</text></g>
        <g transform="translate(106,98)"><rect width="80" height="20" rx="10" fill="#10201a" stroke="#1c3a2e"/><text x="40" y="14" text-anchor="middle">per-agent</text></g>
      </g>
    </g>
    <!-- RAG Ingestion -->
    <g transform="translate(40,540)" filter="url(#shadow)">
      <rect width="378" height="128" rx="14" fill="#121722" stroke="#2b3147"/>
      <rect width="5" height="128" rx="2.5" fill="#38bdf8"/>
      <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">RAG Ingestion</text>
      <text x="24" y="62" fill="#94a3b8" font-size="13">Index a codebase into pgvector so reviewers can</text>
      <text x="24" y="80" fill="#94a3b8" font-size="13">cite real surrounding code as grounding context.</text>
      <g font-size="10.5" font-weight="600" fill="#7dd3fc">
        <g transform="translate(24,98)"><rect width="68" height="20" rx="10" fill="#0e1c28" stroke="#1c3346"/><text x="34" y="14" text-anchor="middle">embed</text></g>
        <g transform="translate(100,98)"><rect width="78" height="20" rx="10" fill="#0e1c28" stroke="#1c3346"/><text x="39" y="14" text-anchor="middle">chunk + store</text></g>
      </g>
    </g>
    <!-- Eval & Regression -->
    <g transform="translate(438,540)" filter="url(#shadow)">
      <rect width="378" height="128" rx="14" fill="#121722" stroke="#2b3147"/>
      <rect width="5" height="128" rx="2.5" fill="#fbbf24"/>
      <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">Eval &amp; Regression</text>
      <text x="24" y="62" fill="#94a3b8" font-size="13">Score datasets with the LLM-as-Judge harness and</text>
      <text x="24" y="80" fill="#94a3b8" font-size="13">compare model versions to flag regressions.</text>
      <g font-size="10.5" font-weight="600" fill="#fcd34d">
        <g transform="translate(24,98)"><rect width="64" height="20" rx="10" fill="#1f1a0e" stroke="#43381c"/><text x="32" y="14" text-anchor="middle">scoring</text></g>
        <g transform="translate(96,98)"><rect width="104" height="20" rx="10" fill="#1f1a0e" stroke="#43381c"/><text x="52" y="14" text-anchor="middle">version deltas</text></g>
      </g>
    </g>
    <!-- History & Detail -->
    <g transform="translate(836,540)" filter="url(#shadow)">
      <rect width="378" height="128" rx="14" fill="#121722" stroke="#2b3147"/>
      <rect width="5" height="128" rx="2.5" fill="#22d3ee"/>
      <text x="24" y="36" fill="#e2e8f0" font-size="16" font-weight="700">History &amp; Detail</text>
      <text x="24" y="62" fill="#94a3b8" font-size="13">Browse every past review with status, judge score,</text>
      <text x="24" y="80" fill="#94a3b8" font-size="13">severity breakdown, findings and reasoning traces.</text>
      <g font-size="10.5" font-weight="600" fill="#67e8f9">
        <g transform="translate(24,98)"><rect width="62" height="20" rx="10" fill="#0e1f22" stroke="#1c3a40"/><text x="31" y="14" text-anchor="middle">audit</text></g>
        <g transform="translate(94,98)"><rect width="76" height="20" rx="10" fill="#0e1f22" stroke="#1c3a40"/><text x="38" y="14" text-anchor="middle">replayable</text></g>
      </g>
    </g>
  </g>

  <!-- Connectors from pipeline/ribbon to use-cases (subtle) -->
  <g stroke="#3b4263" stroke-width="1.5" stroke-dasharray="3 4" fill="none" opacity="0.7">
    <path d="M120,312 L120,392"/>            <!-- SSE -> Live Console -->
    <path d="M981,236 C981,330 627,340 627,392"/>  <!-- Gate -> Approval -->
    <path d="M1154,236 C1154,330 1025,340 1025,392"/> <!-- Report -> Telemetry -->
  </g>

  <!-- Footer -->
  <text x="40" y="712" fill="#475569" font-size="11.5">Every node is metered for token-cost telemetry · Reviewers run a ReAct loop with sandboxed test execution · Offline "stub" mode needs no API key.</text>
  <text x="40" y="744" fill="#334155" font-size="11">REST · MCP server · Server-Sent Events · React + Vite web console</text>
</svg>
