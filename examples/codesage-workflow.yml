# Copy to .github/workflows/codesage.yml in your repository, and add an
# ANTHROPIC_API_KEY repository secret. Comment triggers (/codesage review) only
# work once this file is on the default branch.
name: CodeSage
on:
  pull_request:
    types: [opened, ready_for_review, labeled]
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write   # lets the action remove the codesage:review label
concurrency:
  group: codesage-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'pull_request' && (
        (github.event.action == 'opened' && !github.event.pull_request.draft) ||
        github.event.action == 'ready_for_review' ||
        (github.event.action == 'labeled' && github.event.label.name == 'codesage:review'))) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/codesage review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    steps:
      - uses: Badri-Rajendran/CodeSage@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
