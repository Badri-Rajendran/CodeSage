[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codesage"
version = "0.1.0"
description = "Agentic Code Review Assistant — Claude-powered multi-agent PR review on LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Badri Narayanan" }]
keywords = ["llm", "code-review", "langgraph", "claude", "agents", "pgvector", "rag", "mcp"]

# Engine: everything the GitHub Action needs. Keep this list lean; server-only
# packages go in the `server` extra and must not be imported by the engine.
dependencies = [
    "anthropic>=0.120,<1",
    "langchain>=1.4.2,<1.5",
    "langchain-anthropic>=1.7.4,<2",
    "langchain-core>=1.6.4,<2",
    "langgraph>=1.2.11,<1.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
# Local companion: API server, console backend, RAG store, MCP, HITL checkpoints.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "numpy>=1.26",
    "mcp>=1.1",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]

[project.scripts]
codesage-api = "app.main:run"
codesage-mcp = "app.mcp.server:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
